<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar">
      <div class="brand">
        <button id="collapse" type="button" aria-label="收起导航">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h10"/></svg>
          </span>
          <span class="label">收起</span>
        </button>
      </div>
      <nav id="nav" aria-label="工具"></nav>
    </aside>
    <div id="backdrop" class="backdrop"></div>
    <main>
      <header class="top">
        <button id="menu" class="menu" type="button">工具</button>
        <div id="addresses" class="addresses"></div>
        <p id="offline" class="offline" hidden>无法连接工作台</p>
      </header>
      <div id="workspace"></div>
    </main>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-no" type="button">返回</button>
        <button id="modal-yes" class="danger" type="button">确定</button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
